<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职业锚测试 · Career Anchor Test</title>
<style>
  :root {
    --primary: #4f6df5;
    --primary-dark: #3a54c4;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #2b2f3a;
    --muted: #8a90a3;
    --accent: #f5a623;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef1fa 0%, #f8f5ff 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app { width: 100%; max-width: 720px; }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(79, 109, 245, 0.10);
    padding: 40px 36px;
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px);} to { opacity: 1; transform: none;} }
  h1 { font-size: 26px; margin-bottom: 10px; }
  h2 { font-size: 20px; margin-bottom: 14px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 18px; }
  .btn {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px 34px;
    font-size: 16px;
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
  .btn.ghost:hover { background: rgba(79,109,245,.08); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }

  /* progress */
  .progress-wrap { margin-bottom: 26px; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .progress-bar { height: 8px; background: #e8ebf5; border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #8b6df5); border-radius: 99px; transition: width .3s ease; }

  .q-text { font-size: 20px; line-height: 1.7; margin: 18px 0 30px; min-height: 68px; }
  .scale { display: flex; flex-direction: column; gap: 10px; }
  .scale-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .opt {
    border: 2px solid #e3e7f2;
    background: #fafbfe;
    border-radius: 12px;
    padding: 14px 4px;
    text-align: center;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .opt .num { font-size: 22px; font-weight: 700; color: var(--primary); }
  .opt .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .opt:hover { border-color: var(--primary); transform: translateY(-2px); }
  .opt.sel { border-color: var(--primary); background: rgba(79,109,245,.08); box-shadow: 0 4px 14px rgba(79,109,245,.18); }
  .scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 0 2px; }
  .hint { margin-top: 16px; font-size: 12px; color: var(--muted); text-align: center; }

  /* pick 3 */
  .pick-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; max-height: 46vh; overflow-y: auto; padding-right: 4px; }
  .pick-item {
    display: flex; align-items: center; gap: 12px;
    border: 2px solid #e3e7f2; border-radius: 12px; padding: 12px 14px;
    cursor: pointer; transition: all .15s; background: #fafbfe;
  }
  .pick-item:hover { border-color: var(--primary); }
  .pick-item.sel { border-color: var(--accent); background: rgba(245,166,35,.08); }
  .pick-item .qno {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    background: #eceffb; color: var(--primary); font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .pick-item.sel .qno { background: var(--accent); color: #fff; }
  .pick-item .pt { font-size: 14px; line-height: 1.5; flex: 1; }
  .pick-item .ps { flex: none; font-size: 13px; color: var(--muted); }
  .pick-count { font-size: 14px; color: var(--muted); margin-top: 6px; }
  .pick-count b { color: var(--accent); font-size: 18px; }

  /* results */
  .anchor-hero {
    text-align: center; padding: 26px 20px; border-radius: 14px;
    background: linear-gradient(135deg, #4f6df5, #8b6df5); color: #fff; margin-bottom: 24px;
  }
  .anchor-hero .code { font-size: 15px; opacity: .85; letter-spacing: 2px; }
  .anchor-hero .name { font-size: 28px; font-weight: 700; margin: 6px 0; }
  .anchor-hero .score { font-size: 14px; opacity: .9; }
  .bars { display: flex; flex-direction: column; gap: 12px; margin: 20px 0; }
  .bar-row { display: grid; grid-template-columns: 118px 1fr 56px; align-items: center; gap: 10px; font-size: 13px; }
  .bar-row .bl { color: var(--text); }
  .bar-track { height: 16px; background: #edf0f8; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; background: #c3cdea; transition: width .6s ease; }
  .bar-fill.top { background: linear-gradient(90deg, var(--primary), #8b6df5); }
  .bar-val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .desc-block { margin-top: 22px; border-top: 1px dashed #dfe4f0; padding-top: 18px; }
  .desc-item { margin-bottom: 16px; padding: 14px 16px; background: #fafbfe; border-radius: 12px; border: 1px solid #edf0f8; }
  .desc-item .dt { font-weight: 700; margin-bottom: 6px; font-size: 15px; }
  .desc-item .dt .tag { font-size: 12px; color: #fff; background: var(--primary); border-radius: 6px; padding: 2px 8px; margin-left: 8px; font-weight: 500; }
  .desc-item .dd { font-size: 13px; color: #5a6072; line-height: 1.8; }
  .footer-note { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  @media (max-width: 560px) {
    .card { padding: 28px 20px; }
    .q-text { font-size: 17px; }
    .opt .num { font-size: 18px; }
    .scale-row { gap: 6px; }
    .bar-row { grid-template-columns: 96px 1fr 48px; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const QUESTIONS = [
  "我希望做我擅长的工作，这样我的内行建议可以不断被采纳。",
  "当我整合并管理其他人的工作时，我非常有成就感。",
  "我希望我的工作能让我用自己的方式，按自己的计划去开展。",
  "对我而言，安定与稳定比自由和自主更重要。",
  "我一直在寻找可以让我创立自己事业（公司）的创意（点子）。",
  "我认为只有对社会做出真正贡献的职业才算是成功的职业。",
  "在工作中，我希望去解决那些有挑战性的问题，并且胜出。",
  "我宁愿离开公司，也不愿从事需要个人和家庭做出一定牺牲的工作。",
  "将我的技术和专业水平发展到一个更具有竞争力的层次是成功职业的必要条件。",
  "我希望能够管理一个大的公司（组织），我的决策将会影响许多人。",
  "如果职业允许自由地决定自己的工作内容、计划、过程时，我会非常满意。",
  "如果工作的结果使我丧失了自己在组织中的安全稳定感，我宁愿离开这个工作岗位。",
  "对我而言，创办自己的公司比在其他的公司中争取一个高的管理位置更有意义。",
  "我的职业满足来自于我可以用自己的才能去为他人提供服务。",
  "我认为职业的成就感来自于克服自己面临的非常有挑战性的困难。",
  "我希望我的职业能够兼顾个人、家庭和工作的需要。",
  "对我而言，在我喜欢的专业领域内做资深专家比总经理更具有吸引力。",
  "只有在我成为公司的总经理后，我才认为我的职业人生是成功的。",
  "成功的职业应该允许我有完全的自主与自由。",
  "我愿意在能给我安全感、稳定感的公司中工作。",
  "当通过自己的努力或想法完成工作时，我的工作成就感最强。",
  "对我而言，利用自己的才能使这个世界变得更适合生活或居住，比争取一个高的管理职位更重要。",
  "当我解决了看上去不可能解决的问题，或者在必输无疑的竞赛中胜出，我会非常有成就感。",
  "我认为只有很好地平衡了个人、家庭、职业三者的关系，生活才能算是成功的。",
  "我宁愿离开公司，也不愿频繁接受那些不属于我专业领域的工作。",
  "对我而言，做一个全面管理者比在我喜欢的领域内做资深专家更有吸引力。",
  "对我而言，用我自己的方式不受约束地完成工作，比安全、稳定更加重要。",
  "只有当我的收入和工作有保障时，我才会对工作感到满意。",
  "在我的职业生涯中，如果我能成功地创造或实现完全属于自己的产品或点子，我会感到非常成功。",
  "我希望从事对人类和社会真正有贡献的工作。",
  "我希望工作中有很多的机会，可以不断挑战我解决问题的能力（或竞争力）。",
  "能很好地平衡个人生活与工作，比达到一个高的管理职位更重要。",
  "如果在工作中能经常用到我特别的技巧和才能，我会感到特别满意。",
  "我宁愿离开公司，也不愿意接受让我离开全面管理的工作。",
  "我宁愿离开公司，也不愿意接受约束我自由和自主控制权的工作。",
  "我希望有一份让我有安全感和稳定感的工作。",
  "我梦想着创建属于自己的事业。",
  "如果工作限制了我为他人提供帮助或服务，我宁愿离开公司。",
  "去解决那些几乎无法解决的难题，比获得一个高的管理职位更有意义。",
  "我一直在寻找一份能最小化个人和家庭之间冲突的工作。"
];

const TYPES = [
  { code: "TF", name: "技术/职能型", en: "Technical/Functional Competence",
    desc: "你始终不肯放弃的是在专业领域中展示自己的技能，并不断把技术发展到更高层次的机会。你希望通过施展技能获得别人的认可，乐于接受来自专业领域的挑战。你可能愿意成为技术/职能领域的管理者，但管理本身并不能给你带来乐趣，你极力避免全面管理的职位，因为这意味着脱离自己擅长的专业领域。" },
  { code: "GM", name: "管理型", en: "General/Managerial Competence",
    desc: "你始终不肯放弃的是升迁到组织中更高的管理职位，这样你能够整合其他人的工作，并对组织中某项工作的绩效承担责任。你希望为最终结果负责，并把组织的成功看作自己的工作。即使目前在技术/职能部门，你也会把它看成积累经验的必经过程，目标是尽快获得全面管理职位。" },
  { code: "AU", name: "自主/独立型", en: "Autonomy/Independence",
    desc: "你始终不肯放弃的是按照自己的方式工作和生活。你希望留在能提供足够灵活性、由自己决定何时及如何工作的组织中。你宁可放弃升职加薪的机会，也不愿意丧失独立自主性。为了最大程度的自主和独立，你可能创立自己的公司。" },
  { code: "SE", name: "安全/稳定型", en: "Security/Stability",
    desc: "你始终不肯放弃的是稳定的或终身雇佣制的职位。你希望有成功的感觉，这样才可以放松下来。你关注财务安全和就业安全，对组织忠诚，希望以此获得长期雇佣的承诺。在财务负担加重或面临退休时，这种需要会更加明显。" },
  { code: "EC", name: "创造/创业型", en: "Entrepreneurial Creativity",
    desc: "你始终不肯放弃的是凭借自己的能力和冒险愿望，扫除障碍，创立属于自己的公司或组织。你希望向世界证明自己有能力创建一家企业。现在你可能在为别人工作，但同时会学习并评估未来的机会，一旦时机成熟，就会尽快开始自己的创业历程。" },
  { code: "SV", name: "服务/奉献型", en: "Sense of Service, Dedication to a Cause",
    desc: "你始终不肯放弃的是做一些有价值的事情，比如：让世界更适合人类居住、解决环境问题、增进人与人之间的和谐、帮助他人等。你宁愿离开原来的组织，也不会放弃对这些工作机会的追求，同样也会拒绝任何使你离开这些工作的调动和升迁。" },
  { code: "CH", name: "挑战型", en: "Pure Challenge",
    desc: "你始终不肯放弃的是去解决看上去无法解决的问题、战胜强硬的对手或克服面临的困难。对你而言，职业的意义在于允许你战胜不可能的事情。新奇、多变和困难是挑战的决定因素——如果一件事情非常容易，它立马会变得令人厌倦。" },
  { code: "LS", name: "生活型", en: "Lifestyle",
    desc: "你始终不肯放弃的是平衡并整合个人的、家庭的和职业的需要。你希望生活中的各个部分协调统一地向前发展，因此你希望职业有足够的弹性允许你实现这种整合。你与众不同的地方在于过自己的生活，包括居住在哪里、如何处理家庭事务及在组织内如何发挥自己。" }
];

const SCALE_LABELS = ["从不", "偶尔", "有时", "经常", "频繁", "总是"];
// question i (0-based) belongs to type (i % 8): 0=TF ... 7=LS
const answers = new Array(40).fill(0);
let current = 0;
let bonusPicks = [];

const app = document.getElementById("app");

function renderIntro() {
  app.innerHTML = `
    <div class="card">
      <h1>职业锚测试</h1>
      <p class="sub">
        职业锚（Career Anchor）由麻省理工学院埃德加·施恩（Edgar Schein）教授提出，
        是一个人不得不做出职业选择时，无论如何都不会放弃的那种至关重要的东西或价值观。<br><br>
        本问卷共 <b>40 题</b>，根据你的实际情况从 <b>1～6</b> 中选择一个数字，数字越大表示描述越符合你：<br>
        1 = 完全不符合 &nbsp;·&nbsp; 2/3 = 偶尔或有时这么想 &nbsp;·&nbsp; 4/5 = 经常或频繁这么想 &nbsp;·&nbsp; 6 = 完全符合<br><br>
        请尽可能真实并迅速地作答。除非非常明确，否则不必选极端答案。全程约 5 分钟。
      </p>
      <div class="btn-row">
        <button class="btn" onclick="startTest()">开始测试</button>
      </div>
    </div>`;
}

function startTest() { current = 0; renderQuestion(); }

function renderQuestion() {
  const i = current;
  const pct = Math.round((i / 40) * 100);
  app.innerHTML = `
    <div class="card">
      <div class="progress-wrap">
        <div class="progress-meta"><span>第 ${i + 1} / 40 题</span><span>${pct}%</span></div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="q-text">${QUESTIONS[i]}</div>
      <div class="scale">
        <div class="scale-ends"><span>完全不符合</span><span>完全符合</span></div>
        <div class="scale-row">
          ${[1,2,3,4,5,6].map(v => `
            <div class="opt ${answers[i] === v ? "sel" : ""}" onclick="answer(${v})">
              <div class="num">${v}</div><div class="lbl">${SCALE_LABELS[v-1]}</div>
            </div>`).join("")}
        </div>
      </div>
      <p class="hint">点击选项自动进入下一题，也可按键盘 1～6 作答</p>
      <div class="btn-row">
        ${i > 0 ? `<button class="btn ghost" onclick="prevQ()">上一题</button>` : ""}
      </div>
    </div>`;
}

function answer(v) {
  answers[current] = v;
  if (current < 39) { current++; renderQuestion(); }
  else renderPick3();
}

function prevQ() { if (current > 0) { current--; renderQuestion(); } }

document.addEventListener("keydown", e => {
  if (!document.querySelector(".scale-row")) return;
  const v = parseInt(e.key, 10);
  if (v >= 1 && v <= 6) answer(v);
  if (e.key === "Backspace") prevQ();
});

function renderPick3() {
  // 候选：得分最高的题（默认预选前三名）
  const order = answers.map((s, i) => ({ i, s })).sort((a, b) => b.s - a.s);
  bonusPicks = order.slice(0, 3).map(o => o.i);
  drawPick3();
}

function drawPick3() {
  const order = answers.map((s, i) => ({ i, s })).sort((a, b) => b.s - a.s);
  // 展示得分 >=3 的题，避免列表过长；若不足则全部展示
  let shown = order.filter(o => o.s >= 3);
  if (shown.length < 8) shown = order;
  app.innerHTML = `
    <div class="card">
      <h2>选出最像你的 3 句话</h2>
      <p class="sub">
        以下是你评分较高的描述。请从中挑出 <b>与你日常想法最吻合的 3 项</b>（已默认选中得分最高的 3 项，可修改）。
        这 3 项将在计分时各额外加 4 分，用来确定你的主导职业锚。
      </p>
      <p class="pick-count">已选 <b>${bonusPicks.length}</b> / 3 项</p>
      <div class="pick-list">
        ${shown.map(o => `
          <div class="pick-item ${bonusPicks.includes(o.i) ? "sel" : ""}" onclick="togglePick(${o.i})">
            <div class="qno">${o.i + 1}</div>
            <div class="pt">${QUESTIONS[o.i]}</div>
            <div class="ps">原分 ${o.s}</div>
          </div>`).join("")}
      </div>
      <div class="btn-row">
        <button class="btn" ${bonusPicks.length === 3 ? "" : "disabled"} onclick="renderResult()">查看结果</button>
        <button class="btn ghost" onclick="restart()">重新测试</button>
      </div>
    </div>`;
}

function togglePick(i) {
  if (bonusPicks.includes(i)) {
    bonusPicks = bonusPicks.filter(x => x !== i);
  } else {
    if (bonusPicks.length >= 3) return;
    bonusPicks.push(i);
  }
  drawPick3();
}

function computeScores() {
  const totals = new Array(8).fill(0);
  for (let i = 0; i < 40; i++) {
    let s = answers[i];
    if (bonusPicks.includes(i)) s += 4;
    totals[i % 8] += s;
  }
  return totals.map(t => ({ total: t, avg: t / 5 }));
}

function renderResult() {
  const scores = computeScores();
  const maxAvg = Math.max(...scores.map(s => s.avg));
  const ranked = scores.map((s, t) => ({ ...s, t })).sort((a, b) => b.avg - a.avg);
  const top = ranked[0];
  const topType = TYPES[top.t];
  const also = ranked[1].avg === top.avg ? ranked[1] : null;

  app.innerHTML = `
    <div class="card">
      <div class="anchor-hero">
        <div class="code">${topType.code} · ${topType.en}</div>
        <div class="name">${topType.name}职业锚${also ? " ／ " + TYPES[also.t].name : ""}</div>
        <div class="score">平均分 ${top.avg.toFixed(1)}（总分 ${top.total}）</div>
      </div>
      <h2>八个维度得分</h2>
      <div class="bars">
        ${ranked.map(r => `
          <div class="bar-row">
            <div class="bl">${TYPES[r.t].name} ${TYPES[r.t].code}</div>
            <div class="bar-track"><div class="bar-fill ${r.t === top.t ? "top" : ""}" style="width:0%" data-w="${(r.avg / 10) * 100}"></div></div>
            <div class="bar-val">${r.avg.toFixed(1)}</div>
          </div>`).join("")}
      </div>
      <div class="desc-block">
        <h2>类型解析</h2>
        ${[top.t].concat(also ? [also.t] : []).map(t => `
          <div class="desc-item">
            <div class="dt">${TYPES[t].name}（${TYPES[t].code}）<span class="tag">你的主导锚</span></div>
            <div class="dd">${TYPES[t].desc}</div>
          </div>`).join("")}
        ${TYPES.map((t, idx) => (idx === top.t || (also && idx === also.t)) ? "" : `
          <div class="desc-item">
            <div class="dt">${t.name}（${t.code}）</div>
            <div class="dd">${t.desc}</div>
          </div>`).join("")}
      </div>
      <p class="footer-note">
        说明：计分方式为每类 5 题求总分（选中的 3 项各加 4 分），再除以 5 得平均分（满分 10）。
        本测试为自我探索工具，结果仅供参考，建议结合与职业顾问或伙伴的讨论做进一步判断。
      </p>
      <div class="btn-row">
        <button class="btn" onclick="restart()">重新测试</button>
        <button class="btn ghost" onclick="window.print()">打印结果</button>
      </div>
    </div>`;
  requestAnimationFrame(() => setTimeout(() => {
    document.querySelectorAll(".bar-fill").forEach(el => el.style.width = el.dataset.w + "%");
  }, 50));
}

function restart() {
  answers.fill(0);
  bonusPicks = [];
  renderIntro();
}

renderIntro();
</script>
