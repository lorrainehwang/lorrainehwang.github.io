<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盖洛普优势识别器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
         background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
         min-height:100vh; color:#333; line-height:1.6; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 64px; }
  .card { background:#fff; border-radius:16px; padding:32px; box-shadow:0 10px 40px rgba(0,0,0,.2); }

  h1 { font-size:24px; line-height:1.4; color:#4a3f8c; margin-bottom:16px; }
  .intro p { line-height:1.9; color:#555; margin-bottom:8px; }
  .intro .rules { background:#f4f2ff; border-radius:10px; padding:16px 20px; margin:16px 0 24px; }
  .intro .rules li { margin:4px 0 4px 18px; line-height:1.8; color:#444; }
  .btn { display:inline-block; border:none; cursor:pointer; border-radius:10px; white-space:nowrap;
         padding:12px 32px; font-size:16px; line-height:1.5; font-weight:600; color:#fff;
         background:linear-gradient(135deg,#667eea,#764ba2); transition:.2s; }
  .btn:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(102,126,234,.45); }
  .btn:disabled { opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn.ghost { background:#eceaf6; color:#5a4fb0; }

  /* ===== 答题页 ===== */
  .topbar { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .progress { flex:1; height:10px; background:#eceaf6; border-radius:5px; overflow:hidden; }
  .progress i { display:block; height:100%; border-radius:5px;
                background:linear-gradient(90deg,#667eea,#a06cd5); transition:width .25s; }
  .counter { font-size:14px; color:#777; white-space:nowrap; font-variant-numeric:tabular-nums;
             min-width:64px; text-align:right; }
  .qnum { font-size:13px; color:#9a92c8; letter-spacing:2px; margin-bottom:16px; }
  .vs { display:grid; grid-template-columns:1fr 48px 1fr; gap:16px; align-items:stretch; margin-bottom:24px; }
  .stmt { background:#f7f6fd; border:2px solid #e6e2f7; border-radius:12px; min-height:112px;
          padding:20px; font-size:16px; line-height:1.8; display:flex; align-items:center; }
  .stmt .tag { display:block; font-size:12px; line-height:1.5; color:#9a92c8; margin-bottom:4px; font-weight:700; }
  .vsmark { display:flex; align-items:center; justify-content:center;
            font-weight:800; color:#b7aee0; font-size:15px; }
  .scale { display:flex; justify-content:space-between; font-size:12px; color:#9a92c8; margin-bottom:8px; }
  .opts { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:24px; }
  .opt { border:2px solid #e3dff5; background:#fff; border-radius:10px; cursor:pointer; min-height:64px;
         padding:10px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
         text-align:center; font-size:11px; line-height:1.4; color:#888; transition:.15s; user-select:none; }
  .opt b { font-size:14px; line-height:1.4; color:#5a4fb0; white-space:nowrap; }
  .opt:hover { border-color:#8f7fd8; background:#f6f4ff; }
  .opt.sel { border-color:#6a5acd; background:#6a5acd; color:#fff; }
  .opt.sel b { color:#fff; }
  .nav { display:flex; justify-content:space-between; gap:16px; }
  .hint { text-align:center; font-size:12px; color:#aaa; margin-top:16px; }

  /* ===== 结果页 ===== */
  .lead { color:#666; line-height:1.8; margin-bottom:8px; }
  .badge { display:inline-block; font-size:11px; line-height:1.6; color:#fff; border-radius:8px;
           padding:2px 10px; font-weight:700; white-space:nowrap; }
  .domsum { background:#f7f6fd; border:1px solid #eae6f8; border-radius:12px; padding:20px 24px; margin:16px 0 24px; }
  .domsum h3 { font-size:16px; color:#4a3f8c; margin-bottom:12px; }
  .domrow { display:flex; align-items:center; gap:12px; margin:8px 0; font-size:13px; }
  .domrow .badge { flex:none; width:64px; text-align:center; padding:2px 0; }
  .domrow .domen { flex:none; width:130px; color:#9a92c8; font-size:12px; white-space:nowrap; }
  .dombar { flex:1; height:12px; background:#efecf9; border-radius:6px; overflow:hidden; }
  .dombar i { display:block; height:100%; border-radius:6px; }
  .domrow .domn { flex:none; width:20px; text-align:right; color:#5a4fb0; font-weight:700;
                  font-variant-numeric:tabular-nums; }
  .domread { font-size:13px; color:#555; line-height:1.8; margin-top:12px;
             border-top:1px dashed #e0dbf2; padding-top:12px; }

  .top5 { display:grid; grid-template-columns:1fr; gap:16px; margin:0 0 24px; }
  .t5 { background:linear-gradient(135deg,#6a5acd,#8f6fd8); color:#fff; border-radius:12px; padding:24px; }
  .t5head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .t5 .rank { font-size:12px; font-weight:700; letter-spacing:1px; opacity:.8; }
  .t5title { display:flex; align-items:baseline; gap:8px; margin:8px 0 4px; }
  .t5 .name { font-size:22px; font-weight:800; line-height:1.3; }
  .t5 .en { font-size:12px; opacity:.75; }
  .t5 .score { font-size:13px; opacity:.95; font-variant-numeric:tabular-nums; }
  .t5 .d { font-size:13px; line-height:1.8; margin-top:12px; opacity:.92; }
  .t5 h4 { font-size:13px; margin:16px 0 4px; opacity:.85; }
  .t5 ul { margin:0; padding-left:20px; font-size:13px; line-height:1.8; opacity:.95; }
  .t5 li { margin:2px 0; }
  .t5 .bn { display:flex; gap:8px; font-size:13px; line-height:1.7; margin-top:8px; }
  .t5 .bn b { flex:none; width:52px; }
  .t5 .bn span { flex:1; }

  .tablewrap { overflow-x:auto; margin-bottom:8px; }
  table { width:100%; min-width:520px; border-collapse:collapse; font-size:14px; table-layout:fixed; }
  th,td { padding:10px 12px; text-align:left; vertical-align:middle; }
  th { color:#9a92c8; font-size:12px; font-weight:600; border-bottom:2px solid #eee; white-space:nowrap; }
  td { border-bottom:1px solid #f2f0fa; }
  col.c-rank { width:44px; }
  col.c-score { width:72px; }
  col.c-bar { width:32%; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.hl td { background:#f6f3ff; font-weight:600; }
  .bar { height:12px; background:#efecf9; border-radius:6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:linear-gradient(90deg,#667eea,#a06cd5); border-radius:6px; }
  tr.tlink { cursor:pointer; }
  tr.tlink:hover td { background:#f9f7ff; }
  .tname { color:#5a4fb0; font-weight:600; white-space:nowrap; }
  .tname .en2 { color:#b7aee0; font-size:11px; font-weight:400; margin-left:6px; white-space:nowrap; }
  tr.detailrow td { background:#faf9ff; border-bottom:1px solid #e8e4f6; padding:16px; }
  .dcard { font-size:13px; color:#444; line-height:1.8; }
  .dcard p { margin:4px 0; }
  .dcard h4 { font-size:13px; color:#5a4fb0; margin:12px 0 4px; }
  .dcard ul { margin:0; padding-left:20px; font-size:13px; line-height:1.8; }
  .dcard li { margin:2px 0; }
  .dcard .bn { display:flex; gap:8px; font-size:13px; color:#666; margin-top:8px; }
  .dcard .bn b { flex:none; width:52px; color:#5a4fb0; }
  .dcard .bn span { flex:1; }
  .foot { margin-top:24px; font-size:11px; color:#aaa; text-align:center; line-height:1.6; }
  .rbtns { margin-top:24px; display:flex; gap:12px; flex-wrap:wrap; }

  @media print {
    body { background:#fff; }
    .card { box-shadow:none; }
    .rbtns, .hint { display:none; }
    .t5, .domsum { break-inside:avoid; page-break-inside:avoid; }
    tr.detailrow { display:none !important; }
    tr.tlink .tname { color:#333; }
    .tablewrap { overflow-x:visible; }
  }
  @media (max-width:640px){
    .wrap { padding:16px 8px 48px; }
    .card { padding:24px 16px; }
    .vs { grid-template-columns:1fr; gap:10px; }
    .stmt { min-height:0; padding:16px; }
    .vsmark { padding:2px; }
    .opts { grid-template-columns:1fr; }
    .opt { min-height:52px; flex-direction:row; gap:8px; }
    .domsum { padding:16px; }
    .domrow .domen { display:none; }
    .t5 { padding:20px 16px; }
    .btn { padding:12px 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="app"></div>

function calc(){
  const score = {}; THEMES.forEach(t=>score[t]=0);
  DATA.questions.forEach((q,i)=>{
    const a = answers[i];
    if(a===0) return;
    (DATA.mapping[String(q.no)]||[]).forEach(([theme, side])=>{
      if(a===1) score[theme] += 1;
      else if(a>0 && side==='A') score[theme] += a;
      else if(a<0 && side==='B') score[theme] += -a;
    });
  });
  // 与原 Excel 一致：按「总分 / 出现次数」的均值排名，平分按主题原始顺序

               .sort((x,y)=> y.avg-x.avg || x.order-y.order);
}

function t5card(t,i){
  const d = DATA.detail[t.name];
  return `<div class="t5">
    <div class="t5head"><span class="rank">TOP ${i+1}</span><span class="badge" style="background:${DOMCOLOR[d.domain]}">${d.domain} · ${DOMEN[d.domain]}</span></div>
    <div class="t5title"><span class="name">${t.name}</span><span class="en">${EN[t.name]||''}</span></div>
    <div class="score">得分 ${t.avg.toFixed(2)} / 3</div>
    <div class="d">${d.detail}</div>
    <h4>工作中如何发挥</h4>
    <ul>${d.work.map(w=>`<li>${w}</li>`).join('')}</ul>
    <h4>注意盲点</h4>
    <ul>${d.watch.map(w=>`<li>${w}</li>`).join('')}</ul>
    <div class="bn"><b>能带来</b><span>${d.bring}</span></div>
    <div class="bn"><b>需要</b><span>${d.need}</span></div>
  </div>`;
}

function rowDetail(t){
  const d = DATA.detail[t.name];
  return `<div class="dcard">
    <p><span class="badge" style="background:${DOMCOLOR[d.domain]}">${d.domain} · ${DOMEN[d.domain]}</span></p>
    <p>${d.detail}</p>
    <h4>工作中如何发挥</h4>
    <ul>${d.work.map(w=>`<li>${w}</li>`).join('')}</ul>
    <h4>注意盲点</h4>
    <ul>${d.watch.map(w=>`<li>${w}</li>`).join('')}</ul>
    <div class="bn"><b>能带来</b><span>${d.bring}</span></div>
    <div class="bn"><b>需要</b><span>${d.need}</span></div>
  </div>`;
}

function toggleDetail(name){
  const el = document.getElementById('d-'+name);
  if(el) el.style.display = el.style.display==='none' ? '' : 'none';
}

function showResult(){
  const ranked = calc();
  const top5 = ranked.slice(0,5);
  const domCount = {}; DOMS.forEach(d=>domCount[d]=0);
  top5.forEach(t=>domCount[DATA.detail[t.name].domain]++);
  const maxDom = Math.max(...DOMS.map(d=>domCount[d]));
  const leadDoms = DOMS.filter(d=>domCount[d]===maxDom);
  const TYPE = {"执行力":"落地驱动型，擅长把事情做成","影响力":"影响带动型，擅长推动他人与局面","关系建立":"关系驱动型，擅长凝聚人心与协作","战略思维":"思考驱动型，擅长分析、学习与谋划"};
  const reading = maxDom>=3
    ? `你的 TOP 5 中有 ${maxDom} 个集中在「${leadDoms[0]}」维度，说明你是典型的${TYPE[leadDoms[0]]}。`
    : `你的 TOP 5 分布较为均衡，其中${leadDoms.map(d=>`「${d}」`).join('、')}相对突出（${TYPE[leadDoms[0]]}），说明你兼具多种驱动方式。`;
  app.innerHTML = `
    <h1>测试结果</h1>
    <p class="lead">您的五大优势主题如下，点击榜单中任意主题名可展开详细解读（得分 = 平均强度，满分 3）。</p>
    <div class="domsum">
      <h3>维度分布（TOP 5）</h3>
      ${DOMS.map(d=>`<div class="domrow">
        <span class="badge" style="background:${DOMCOLOR[d]}">${d}</span>
        <span class="domen">${DOMEN[d]}</span>
        <div class="dombar"><i style="width:${domCount[d]/5*100}%;background:${DOMCOLOR[d]}"></i></div>
        <span class="domn">${domCount[d]}</span>
      </div>`).join('')}
      <p class="domread">${reading}</p>
    </div>
    <div class="top5">
      ${top5.map((t,i)=>t5card(t,i)).join('')}
    </div>
    <div class="tablewrap">
    <table>
      <colgroup><col class="c-rank"><col><col class="c-score"><col class="c-bar"></colgroup>
      <tr><th class="num">#</th><th>优势主题</th><th class="num">得分</th><th>强度</th></tr>
      ${ranked.map((t,i)=>`<tr class="${i<5?'hl ':''}tlink" onclick="toggleDetail('${t.name}')">
        <td class="num">${i+1}</td><td class="tname">${t.name}<span class="en2">${EN[t.name]||''}</span></td><td class="num">${t.avg.toFixed(2)}</td>
        <td><div class="bar"><i style="width:${Math.round(t.avg/3*100)}%"></i></div></td>
      </tr>
      <tr class="detailrow" id="d-${t.name}" style="display:none"><td colspan="4">${rowDetail(t)}</td></tr>`).join('')}
    </table>
    </div>
    <div class="foot">内容参考 Gallup 官方 CliftonStrengths 主题定义（https://www.gallup.com/cliftonstrengths/），仅供个人发展参考，非官方测评报告。</div>
    <div class="rbtns">
      <button class="btn" onclick="if(confirm('确定要重新测试吗？当前答案将被清空')){answers.fill(0);showIntro();}">重新测试</button>
      <button class="btn ghost" onclick="window.print()">打印 / 保存 PDF</button>
    </div>`;
  window.scrollTo(0,0);
}

document.addEventListener('keydown', e=>{
  if(!document.querySelector('.opts')) return;
  const map = {'1':3,'2':2,'3':1,'4':-2,'5':-3};
  if(map[e.key]!==undefined) pick(map[e.key]);
  else if(e.key==='Enter') next();
  else if(e.key==='ArrowLeft') prev();
});

showIntro();
</script>
